name: Taroko Public Metadata Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Taroko metadata pipeline
        run: |
          python scripts/run_pipeline.py

      - name: Validate corpus outputs
        run: |
          python scripts/06_validate_corpus.py

      - name: Safety check — no unsafe files staged
        run: |
          echo "=== git status ==="
          git status --short

          UNSAFE=$(git status --short | awk '{print $2}' | grep -E \
            '^archive/raw_html/[^.]|^archive/screenshots/[^.]|^archive/output_samples/[^.]|^archive/extracted_full/[^.]|^data/private/[^.]' \
            | grep -v '\.gitkeep$' || true)

          if [ -n "$UNSAFE" ]; then
            echo "ERROR: unsafe files would be committed:"
            echo "$UNSAFE"
            exit 1
          fi
          echo "Safety check passed — no unsafe files staged."

      - name: Commit public metadata outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/public/taroko_links.csv \
            data/public/collect_links_log.csv \
            data/public/download_log.csv \
            data/public/inventory.csv \
            data/public/lexical_array_summary.csv \
            data/public/runtime_sample_log.csv \
            data/public/validation_summary.csv \
            notes/RUN_REPORT.md \
            notes/HANDOFF.md \
            notes/METHOD.md \
            README.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No public metadata changes to commit."
          else
            git commit -m "chore: update Taroko public metadata"
            git push origin HEAD
          fi

      - name: Upload public metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: taroko-public-metadata
          path: |
            data/public/
            notes/RUN_REPORT.md
            notes/HANDOFF.md
            notes/METHOD.md
            README.md
          if-no-files-found: warn
          retention-days: 14
