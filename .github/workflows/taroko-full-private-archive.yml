name: Taroko Full Private Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Run full archive pipeline
        run: python scripts/run_pipeline_full.py --seconds 20

      - name: Validate private archive
        run: python scripts/06_validate_private.py

      - name: Verify required outputs exist
        run: |
          echo "=== Checking required outputs ==="

          if [ ! -f private_archive/taroko_full_archive.zip ]; then
            echo "ERROR: zip package not found"
            exit 1
          fi
          ls -lh private_archive/taroko_full_archive.zip

          if [ ! -f data/private/taroko_corpus_catalog.csv ]; then
            echo "ERROR: corpus catalog not found"
            exit 1
          fi
          echo "Catalog rows: $(wc -l < data/private/taroko_corpus_catalog.csv)"

          if [ ! -f data/private/archive_manifest.csv ]; then
            echo "ERROR: manifest not found"
            exit 1
          fi
          echo "Manifest rows: $(wc -l < data/private/archive_manifest.csv)"

          RAW_COUNT=$(find archive/raw_html -type f ! -name '.gitkeep' | wc -l)
          echo "Raw HTML files: $RAW_COUNT"
          if [ "$RAW_COUNT" -eq 0 ]; then
            echo "ERROR: no raw HTML files found"
            exit 1
          fi

          echo "All required outputs present."

      - name: Commit archive outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/public/ \
            data/private/ \
            archive/raw_html/ \
            archive/extracted_full/ \
            archive/output_samples/ \
            archive/screenshots/ \
            private_archive/ \
            notes/RUN_REPORT.md \
            notes/FULL_ARCHIVE_README.md \
            notes/METHOD.md \
            README.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "chore: update full Taroko private archive"
            git push origin HEAD
          fi

      - name: Upload archive zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: taroko-full-archive
          path: private_archive/taroko_full_archive.zip
          if-no-files-found: warn
          retention-days: 30
