name: Archive MVP v2 — Live Paratext Capture

on:
  push:
    branches: [archive-mvp-v2]
    paths:
      - 'scripts/**'
      - 'notes/**'
      - 'data/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'notes/**'
      - 'data/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  live-paratext-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: archive-mvp-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ensure private directories exist
        run: |
          mkdir -p data/private/context
          mkdir -p data/private/query_exports
          mkdir -p archive/context_pages
          mkdir -p archive/context_screenshots

      - name: Run script 14 — Capture paratext pages
        run: |
          python scripts/14_capture_paratext_pages.py 2>&1 | tee /tmp/step14.log
          echo "### Script 14 output" >> /tmp/run_log.md
          tail -30 /tmp/step14.log >> /tmp/run_log.md

      - name: Run script 15 — Extract paratext sections
        run: |
          python scripts/15_extract_paratext_sections.py 2>&1 | tee /tmp/step15.log
          echo "### Script 15 output" >> /tmp/run_log.md
          tail -30 /tmp/step15.log >> /tmp/run_log.md

      - name: Run script 16 — Reconcile work entities
        run: |
          python scripts/16_reconcile_work_entities.py 2>&1 | tee /tmp/step16.log
          echo "### Script 16 output" >> /tmp/run_log.md
          tail -30 /tmp/step16.log >> /tmp/run_log.md

      - name: Run script 17 — Build statement layer v2
        run: |
          python scripts/17_build_statement_layer_v2.py 2>&1 | tee /tmp/step17.log
          echo "### Script 17 output" >> /tmp/run_log.md
          tail -30 /tmp/step17.log >> /tmp/run_log.md

      - name: Run script 18 — Audit lexical mechanisms v2
        run: |
          python scripts/18_audit_lexical_mechanisms_v2.py 2>&1 | tee /tmp/step18.log
          echo "### Script 18 output" >> /tmp/run_log.md
          tail -30 /tmp/step18.log >> /tmp/run_log.md

      - name: Run script 19 — Build query index v2
        run: |
          python scripts/19_build_query_index_v2.py 2>&1 | tee /tmp/step19.log
          echo "### Script 19 output" >> /tmp/run_log.md
          tail -30 /tmp/step19.log >> /tmp/run_log.md

      - name: Run query CLI v2 — overview
        run: |
          echo "### Query CLI: overview" >> /tmp/run_log.md
          python scripts/20_query_archive_v2.py overview 2>&1 | tee -a /tmp/run_log.md

      - name: Run query CLI v2 — entities
        run: |
          echo "### Query CLI: entities" >> /tmp/run_log.md
          python scripts/20_query_archive_v2.py entities 2>&1 | tee -a /tmp/run_log.md

      - name: Run query CLI v2 — explicit_author_statement
        run: |
          echo "### Query CLI: statements --type explicit_author_statement" >> /tmp/run_log.md
          python scripts/20_query_archive_v2.py statements --type explicit_author_statement 2>&1 | tee -a /tmp/run_log.md || true

      - name: Run query CLI v2 — editorial_statement
        run: |
          echo "### Query CLI: statements --type editorial_statement" >> /tmp/run_log.md
          python scripts/20_query_archive_v2.py statements --type editorial_statement 2>&1 | tee -a /tmp/run_log.md || true

      - name: Run query CLI v2 — failures
        run: |
          echo "### Query CLI: failures" >> /tmp/run_log.md
          python scripts/20_query_archive_v2.py failures 2>&1 | tee -a /tmp/run_log.md

      - name: Run verification
        id: verify
        run: |
          echo "### Verification" >> /tmp/run_log.md
          python scripts/21_verify_archive_mvp_v2.py 2>&1 | tee -a /tmp/run_log.md
          # Capture exit code
          python scripts/21_verify_archive_mvp_v2.py > /dev/null 2>&1 && echo "verify_passed=true" >> $GITHUB_OUTPUT || echo "verify_passed=false" >> $GITHUB_OUTPUT

      - name: Summarize capture results
        run: |
          echo "" >> /tmp/run_log.md
          echo "### Capture Summary" >> /tmp/run_log.md
          if [ -f data/private/context/context_page_capture_log.csv ]; then
            TOTAL=$(tail -n +2 data/private/context/context_page_capture_log.csv | wc -l)
            SUCCESS=$(tail -n +2 data/private/context/context_page_capture_log.csv | grep -c ",200," || true)
            FAIL=$((TOTAL - SUCCESS))
            echo "- Context page candidates: $TOTAL" >> /tmp/run_log.md
            echo "- Successful captures: $SUCCESS" >> /tmp/run_log.md
            echo "- Failed captures: $FAIL" >> /tmp/run_log.md
          fi
          if [ -f data/private/context/elc_paratext_sections.csv ]; then
            SECTIONS=$(tail -n +2 data/private/context/elc_paratext_sections.csv | grep -c ",yes," || true)
            echo "- ELC sections extracted (present=yes): $SECTIONS" >> /tmp/run_log.md
          fi
          if [ -f data/private/statement_sources_v2.csv ]; then
            STMTS=$(tail -n +2 data/private/statement_sources_v2.csv | wc -l)
            echo "- Statement sources: $STMTS" >> /tmp/run_log.md
            AUTHOR=$(tail -n +2 data/private/statement_sources_v2.csv | grep -c "explicit_author_statement" || true)
            EDITORIAL=$(tail -n +2 data/private/statement_sources_v2.csv | grep -c "editorial_statement" || true)
            echo "- Explicit author statements: $AUTHOR" >> /tmp/run_log.md
            echo "- Editorial statements: $EDITORIAL" >> /tmp/run_log.md
          fi
          if [ -f data/private/work_entities.csv ]; then
            WE=$(tail -n +2 data/private/work_entities.csv | wc -l)
            echo "- Work entities: $WE" >> /tmp/run_log.md
          fi
          cat /tmp/run_log.md

      - name: Write run log to notes/
        run: |
          {
            echo "# Archive MVP v2 Live Paratext Run Log"
            echo ""
            echo "Run date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Runner: ubuntu-latest / GitHub Actions"
            echo "Branch: archive-mvp-v2"
            echo ""
            cat /tmp/run_log.md
          } > notes/archive_mvp_v2_live_paratext_run_log.md

      - name: Upload context_pages as artifact (full captures stay private)
        uses: actions/upload-artifact@v4
        with:
          name: context-pages-html
          path: archive/context_pages/
          if-no-files-found: warn

      - name: Upload context_screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: context-screenshots
          path: archive/context_screenshots/
          if-no-files-found: warn

      - name: Commit updated outputs if verification passed
        if: steps.verify.outputs.verify_passed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/private/context/context_page_candidates.csv \
            data/private/context/context_page_capture_log.csv \
            data/private/context/elc_paratext_sections.csv \
            data/private/context/elc_work_metadata.csv \
            data/private/context/elc_download_links.csv \
            data/private/work_entities.csv \
            data/private/work_entity_links.csv \
            data/private/work_entity_evidence_matrix.csv \
            data/private/statement_sources_v2.csv \
            data/private/statement_excerpts_safe.csv \
            data/private/lexical_mechanisms_v2.csv \
            data/private/lexical_candidates_v2.json \
            data/private/query_exports/audit_scores.csv \
            data/private/query_exports/runtime_sampling_audit.csv \
            data/private/query_exports/notes_count_audit.csv \
            data/private/query_exports/mirror_pair_hash_comparison.csv \
            data/private/taroko_query_index_v2.sqlite \
            notes/ELC_PARATEXT_CAPTURE_REPORT.md \
            notes/STATEMENT_LAYER_V2_REPORT.md \
            notes/WORK_ENTITY_RECONCILIATION_REPORT.md \
            notes/ARCHIVE_MVP_V2_VERIFICATION.md \
            notes/ARCHIVE_MVP_V2_FINAL_REPORT.md \
            notes/WHAT_CAN_NOW_BE_ASKED.md \
            notes/WHAT_REMAINS_UNCERTAIN.md \
            notes/archive_mvp_v2_live_paratext_run_log.md \
            archive/context_pages/.gitkeep \
            archive/context_screenshots/.gitkeep \
            data/private/context/.gitkeep \
            || true
          git diff --staged --quiet || git commit -m "ci: update paratext/statement/entity outputs from live capture run [skip ci]"
          git pull --rebase origin archive-mvp-v2 || true
          git push origin archive-mvp-v2

      - name: Skip commit — verification failed
        if: steps.verify.outputs.verify_passed != 'true'
        run: |
          echo "Verification did not pass — skipping commit of generated outputs."
          exit 1
